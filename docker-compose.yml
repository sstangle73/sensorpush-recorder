services:
  sensorpush-recorder:
    build: .
    container_name: sensorpush-recorder
    # `always` (not `unless-stopped`) so the weekly host reboot brings the
    # container back even if a prior run had ended in an Exited state — the
    # failure mode that once left the recorder down for days across a reboot.
    restart: always
    init: true
    # Give the graceful-shutdown handler (server.js) time to close the HTTP
    # server + DB handle on `docker stop` / redeploy before SIGKILL.
    stop_grace_period: 30s
    ports:
      - "3003:3003"
    environment:
      # Allowlist of origins permitted to call this API cross-origin.
      # Comma-separated, no spaces. Each value must match a request's
      # Origin header exactly (scheme + host + port). Leave empty if you
      # only call this service from same-origin or via a reverse proxy
      # that handles CORS itself.
      # Example:
      #   CORS_ORIGINS: "https://dashboard.example.com,http://localhost:8080"
      CORS_ORIGINS: ""
      # Optional MQTT publisher (for Home Assistant or other consumers).
      # Leave MQTT_URL empty/unset to disable — the publisher becomes a no-op
      # and no broker connection is attempted. When set, the recorder publishes
      # per-sensor state JSON to <MQTT_TOPIC_PREFIX><sensor_id>/state after
      # every poll, and HA MQTT discovery configs to
      # <MQTT_DISCOVERY_PREFIX>sensor/<sensor_id>_<metric>/config on connect
      # and hourly thereafter. Topics use retained messages.
      # Example:
      #   MQTT_URL: "mqtt://broker.lan:1883"
      #   MQTT_USERNAME: "sensorpush"
      #   MQTT_PASSWORD: "changeme"
      MQTT_URL: ""
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_TOPIC_PREFIX: "sensorpush/"
      MQTT_DISCOVERY_PREFIX: "homeassistant/"
    volumes:
      - ./config.local.js:/config/config.local.js:ro
      - ./data:/data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3003/health || exit 1
      # /health does no DB work (no query, no fsync), so a slow disk cannot
      # fail it on its own. On top of that liveness check it now also asserts
      # that the poll loop is still producing: unhealthy after 30 min with no
      # successful poll (HEALTH_MAX_POLL_AGE_SECS, 0 disables). That check
      # engages only after a first poll has succeeded, so a fresh or
      # misconfigured recorder still reports healthy rather than restart-
      # looping — the false-positive class this healthcheck has to avoid.
      #
      # Why the poll assertion exists: pure liveness answers ok:true however
      # long the poll loop has produced nothing. A recorder that was polling
      # and then stops succeeding (its password changed, the SensorPush cloud
      # is down, polls overrunning their interval) gets one restart this way;
      # the restarted process has not succeeded yet, so it reports healthy
      # from then on and the poll-age alert carries the outage. (2026-09-02
      # was a different failure: every scrape failed within 2 ms with no
      # samples for the whole 20 h, because the container was down after the
      # failed restart described below.)
      #
      # Caveat worth knowing before tightening any of this: an unhealthy verdict
      # makes autoheal issue `docker restart`, and during the nightly slow-disk
      # window that restart is itself dangerous — on 2026-09-02 the kill got no
      # exit event ("tried to kill container, but did not receive an exit
      # event"), the restart request failed, and the container was left dead for
      # 20 h because `restart: always` does not cover an API restart that
      # aborted. Keep these values tolerant: ≈5 min continuously unhealthy
      # before autoheal acts, plus a long startup grace.
      start_period: 180s
      interval: 1m
      timeout: 10s
      retries: 5
    labels:
      - autoheal=true
