services:
  sensorpush-recorder:
    build: .
    container_name: sensorpush-recorder
    restart: unless-stopped
    init: true
    ports:
      - "3003:3003"
    environment:
      # Allowlist of origins permitted to call this API cross-origin.
      # Comma-separated, no spaces. Each value must match a request's
      # Origin header exactly (scheme + host + port). Leave empty if you
      # only call this service from same-origin or via a reverse proxy
      # that handles CORS itself.
      # Example:
      #   CORS_ORIGINS: "https://dashboard.example.com,http://localhost:8080"
      CORS_ORIGINS: ""
      # Optional MQTT publisher (for Home Assistant or other consumers).
      # Leave MQTT_URL empty/unset to disable — the publisher becomes a no-op
      # and no broker connection is attempted. When set, the recorder publishes
      # per-sensor state JSON to <MQTT_TOPIC_PREFIX><sensor_id>/state after
      # every poll, and HA MQTT discovery configs to
      # <MQTT_DISCOVERY_PREFIX>sensor/<sensor_id>_<metric>/config on connect
      # and hourly thereafter. Topics use retained messages.
      # Example:
      #   MQTT_URL: "mqtt://broker.lan:1883"
      #   MQTT_USERNAME: "sensorpush"
      #   MQTT_PASSWORD: "changeme"
      MQTT_URL: ""
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_TOPIC_PREFIX: "sensorpush/"
      MQTT_DISCOVERY_PREFIX: "homeassistant/"
    volumes:
      - ./config.local.js:/config/config.local.js:ro
      - ./data:/data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3003/health || exit 1
      start_period: 30s
      interval: 1m
      timeout: 5s
      retries: 3
    labels:
      - autoheal=true
