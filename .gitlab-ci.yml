# Pinned to the same Node major as the Dockerfile (22-alpine) so anything
# the runtime catches surfaces here too. node:sqlite is stable on 22+.
image: node:22-alpine

stages:
  - test

test:
  stage: test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci || npm install
    - npm run test:ci
  artifacts:
    when: always
    # JUnit XML feeds the GitLab "Tests" tab on the pipeline page and the
    # MR widget. `when: always` so a failing run still uploads the report
    # (which is precisely when you want to inspect it).
    reports:
      junit: test-results/junit.xml
    paths:
      - test-results/
    expire_in: 1 week
  rules:
    # Run on every push to any branch and on merge requests.
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
