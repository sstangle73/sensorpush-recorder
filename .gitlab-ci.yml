# Pinned to the same Node major as the Dockerfile (22-alpine) so anything
# the runtime catches surfaces here too. node:sqlite is stable on 22+.
image: node:22-alpine

stages:
  - test
  - publish

test:
  stage: test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci || npm install
    - npm run test:ci
  artifacts:
    when: always
    # JUnit XML feeds the GitLab "Tests" tab on the pipeline page and the
    # MR widget. `when: always` so a failing run still uploads the report
    # (which is precisely when you want to inspect it).
    reports:
      junit: test-results/junit.xml
    paths:
      - test-results/
    expire_in: 1 week
  rules:
    # Run on every push to any branch and on merge requests.
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Build and push a multi-arch image to the project's Container Registry.
# Used by rosestorie's managed-tier provisioning (control-plane spawns a
# Fly machine pulling registry.gitlab.com/sstangle73/sensorpush-recorder:<tag>).
#
# Tags:
#   - registry...:latest      → main branch
#   - registry...:<short-sha> → every main build (pin-friendly)
#   - registry...:<git-tag>   → release tags
#
# CI_REGISTRY_USER / CI_REGISTRY_PASSWORD are auto-injected by GitLab CI.
# The project's Container Registry visibility must match project visibility
# for Fly to pull anonymously.
publish-image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - SHORT_SHA=$(echo "$CI_COMMIT_SHA" | cut -c1-8)
    - docker build -t "$CI_REGISTRY_IMAGE:$SHORT_SHA" .
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "master" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    - docker push "$CI_REGISTRY_IMAGE:$SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG
